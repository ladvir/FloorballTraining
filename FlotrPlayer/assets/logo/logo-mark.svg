<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Same tactics-court + ball mark as FloTr's web icon (FloTr/public/icon-512.svg), recolored
       to FlotrPlayer's own theme tokens (src/theme/tokens.ts) instead of FloTr's cyan palette.
       Transparent background: scripts/generate-icons.mjs composites this onto the app's own
       blue->navy gradient (and onto transparent for splash/adaptive-icon layers). -->
  <defs>
    <radialGradient id="ball" cx="0.38" cy="0.32" r="0.85">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#F8FAFC"/>
      <stop offset="0.82" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#64748B"/>
    </radialGradient>
    <mask id="ballHoles">
      <circle cx="176" cy="344" r="52" fill="#ffffff"/>
      <circle cx="169.7" cy="337.7" r="10.8" fill="#000000"/>
      <ellipse cx="208.9" cy="352.8" rx="8.2" ry="11" fill="#000000" transform="rotate(15 208.9 352.8)"/>
      <ellipse cx="184.8" cy="376.9" rx="8.2" ry="11" fill="#000000" transform="rotate(75 184.8 376.9)"/>
      <ellipse cx="151.9" cy="368.1" rx="8.2" ry="11" fill="#000000" transform="rotate(135 151.9 368.1)"/>
      <ellipse cx="143.1" cy="335.2" rx="8.2" ry="11" fill="#000000" transform="rotate(195 143.1 335.2)"/>
      <ellipse cx="167.2" cy="311.1" rx="8.2" ry="11" fill="#000000" transform="rotate(255 167.2 311.1)"/>
      <ellipse cx="200.1" cy="319.9" rx="8.2" ry="11" fill="#000000" transform="rotate(315 200.1 319.9)"/>
      <ellipse cx="209.9" cy="377.9" rx="3.8" ry="11" fill="#000000" transform="rotate(45 209.9 377.9)"/>
      <ellipse cx="163.6" cy="390.3" rx="3.8" ry="11" fill="#000000" transform="rotate(105 163.6 390.3)"/>
      <ellipse cx="129.7" cy="356.4" rx="3.8" ry="11" fill="#000000" transform="rotate(165 129.7 356.4)"/>
      <ellipse cx="142.1" cy="310.1" rx="3.8" ry="11" fill="#000000" transform="rotate(225 142.1 310.1)"/>
      <ellipse cx="188.4" cy="297.7" rx="3.8" ry="11" fill="#000000" transform="rotate(285 188.4 297.7)"/>
      <ellipse cx="222.3" cy="331.6" rx="3.8" ry="11" fill="#000000" transform="rotate(345 222.3 331.6)"/>
    </mask>
  </defs>
  <g transform="rotate(-6 256 256)">
    <rect x="116" y="114" width="292" height="304" rx="78" fill="none" stroke="#0B1120" stroke-opacity="0.35" stroke-width="20"/>
    <rect x="110" y="104" width="292" height="304" rx="78" fill="none" stroke="#F8FAFC" stroke-width="20"/>
    <path d="M 122 256 H 390" stroke="#F8FAFC" stroke-width="13" stroke-linecap="round"/>
    <path d="M 308 278 L 352 322 M 352 278 L 308 322" stroke="#F8FAFC" stroke-width="16" stroke-linecap="round"/>
    <circle cx="216" cy="164" r="23" fill="none" stroke="#F8FAFC" stroke-width="14"/>
    <path d="M 222 306 C 270 268 296 234 322 206" fill="none" stroke="#F8FAFC" stroke-width="13" stroke-linecap="round" stroke-dasharray="1 27"/>
    <polygon points="360,172 345,211 321,187" fill="#F8FAFC"/>
    <circle cx="180" cy="354" r="52" fill="#0B1120" fill-opacity="0.35"/>
    <!-- Holes are real cutouts (mask), not a filled color - a hollow ball lets whatever is
         behind it show through, that's what read as "black interior" before. The thin stroke
         on top gives each hole a visible rim so the ball doesn't flatten into a blank sphere. -->
    <circle cx="176" cy="344" r="52" fill="url(#ball)" mask="url(#ballHoles)"/>
    <g fill="none" stroke="#64748B" stroke-opacity="0.6" stroke-width="1.8">
      <circle cx="169.7" cy="337.7" r="10.8"/>
      <ellipse cx="208.9" cy="352.8" rx="8.2" ry="11" transform="rotate(15 208.9 352.8)"/>
      <ellipse cx="184.8" cy="376.9" rx="8.2" ry="11" transform="rotate(75 184.8 376.9)"/>
      <ellipse cx="151.9" cy="368.1" rx="8.2" ry="11" transform="rotate(135 151.9 368.1)"/>
      <ellipse cx="143.1" cy="335.2" rx="8.2" ry="11" transform="rotate(195 143.1 335.2)"/>
      <ellipse cx="167.2" cy="311.1" rx="8.2" ry="11" transform="rotate(255 167.2 311.1)"/>
      <ellipse cx="200.1" cy="319.9" rx="8.2" ry="11" transform="rotate(315 200.1 319.9)"/>
      <ellipse cx="209.9" cy="377.9" rx="3.8" ry="11" transform="rotate(45 209.9 377.9)"/>
      <ellipse cx="163.6" cy="390.3" rx="3.8" ry="11" transform="rotate(105 163.6 390.3)"/>
      <ellipse cx="129.7" cy="356.4" rx="3.8" ry="11" transform="rotate(165 129.7 356.4)"/>
      <ellipse cx="142.1" cy="310.1" rx="3.8" ry="11" transform="rotate(225 142.1 310.1)"/>
      <ellipse cx="188.4" cy="297.7" rx="3.8" ry="11" transform="rotate(285 188.4 297.7)"/>
      <ellipse cx="222.3" cy="331.6" rx="3.8" ry="11" transform="rotate(345 222.3 331.6)"/>
    </g>
  </g>
</svg>
